# What ships in µPi is scanned; tests, benchmarks, build and maintenance scripts and example extensions are not.
name: µPi
paths-ignore:
  - "**/test/**"
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.mjs"
  - bench/**
  - scripts/**
  - packages/*/scripts/**
  - packages/coding-agent/examples/**
  - examples/**
