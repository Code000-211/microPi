name: CI

on:
  push:
    branches: [main, upi]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Check install.sh syntax
        run: sh -n install.sh
      - name: Go vet
        run: CGO_ENABLED=0 go vet ./cmd/... ./coding/... ./internal/... ./ai/... ./agent/...

  build-and-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: Build static upi binary
        run: CGO_ENABLED=0 go build -buildvcs=false -trimpath -o ./bin/upi ./cmd/upi
      - name: Verify version and help
        run: |
          ./bin/upi --version
          ./bin/upi --help >/dev/null
      - name: Run E2E test suite
        working-directory: tests/e2e
        env:
          UPI_BIN: ${{ github.workspace }}/bin/upi
          E2E_REQUIRE_BIN: "1"
          GOWORK: "off"
        run: go test -v -timeout 10m ./...
