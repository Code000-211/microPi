name: publish

# Publishes a release the release workflow drafted: signs SHA256SUMS when the draft has no SHA256SUMS.sig yet, checks
# SHA256SUMS.sig against keys/release.pub and that SHA256SUMS lists exactly the files of a release, each as it is
# (scripts/check-release-files.sh, scripts/release-files.txt), and publishes the GitHub release (as the latest, or as a
# pre-release).
#
# Signing: the release key is the secret MICROPI_SIGNING_KEY of the "release" environment, which only runs this workflow from
# pi-bolt; it is used in one step below and nowhere else. What runs near it is pi-bolt's, not the tag's: the tag must be a commit
# on pi-bolt, and the checks and the public key are taken from pi-bolt as this run was started from it.
# A draft signed by hand (scripts/sign-release.sh) is published as signed.
#
# Run it from pi-bolt with the tag (the workflow and its checks are pi-bolt's, the files published are the tag's):
#   gh workflow run publish.yml -R Code000-211/microPi -f tag=upi-vX.Y.Z
# A release is staged first with -f prerelease=true: a GitHub pre-release, which only the beta channel takes
# (`upi update --channel beta`). Run it again for the same tag without it to make the release the latest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The signed draft to publish (upi-vX.Y.Z)"
        required: true
      prerelease:
        description: "Stage it as a pre-release (the beta channel) instead of making it the latest"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag }}
  PRERELEASE: ${{ github.event.inputs.prerelease == 'true' }}

jobs:
  verify:
    name: Signature and checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # (A draft release is only visible to a token that may write.)
    environment: release
    steps:
      - name: The run
        run: |
          [ "$GITHUB_REF" = refs/heads/pi-bolt ] || { echo "run this workflow from pi-bolt"; exit 1; }
          printf '%s' "$TAG" | grep -Eq '^upi-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $TAG"; exit 1; }
      # pi-bolt as this run was started from it (github.sha), with its history and tags: the checks and the key are its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on pi-bolt
        run: |
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null || { echo "no tag $TAG"; exit 1; }
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "$GITHUB_SHA" ||
            { echo "::error::$TAG is not a commit on pi-bolt ($GITHUB_SHA): only what reached pi-bolt is signed and published"; exit 1; }
      - name: Download the draft
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
        env:
          GH_TOKEN: ${{ github.token }}
      - name: The files (before anything is signed; no key here)
        run: scripts/check-release-files.sh release "${TAG#upi-v}"
      - name: Sign
        working-directory: release
        run: |
          if [ -f SHA256SUMS.sig ] && [ -f SHA256SUMS.sshsig ]; then echo "the draft is signed"; exit 0; fi
          [ -n "$SIGNING_KEY" ] || { echo "::error::$TAG lacks SHA256SUMS.sig or SHA256SUMS.sshsig and the release environment has no MICROPI_SIGNING_KEY"; exit 1; }
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printenv SIGNING_KEY > "$key")
          openssl pkey -in "$key" -pubout | cmp -s - ../keys/release.pub || { echo "::error::MICROPI_SIGNING_KEY is not the key of keys/release.pub"; exit 1; }
          # Both signatures are made again whenever one is missing: one left from an earlier SHA256SUMS would not verify.
          # (Ed25519 signatures are deterministic, so a .sig that was already right comes out the same.)
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          node ../scripts/lib/sshsig.mjs sign "$key" SHA256SUMS SHA256SUMS.sshsig
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS.sig SHA256SUMS.sshsig
        env:
          SIGNING_KEY: ${{ secrets.MICROPI_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
      - name: Check
        run: |
          openssl version
          openssl pkeyutl -verify -pubin -inkey keys/release.pub -rawin -in release/SHA256SUMS -sigfile release/SHA256SUMS.sig
          printf 'upi namespaces="upi-release" %s\n' "$(node scripts/lib/sshsig.mjs pubkey keys/release.pub)" > "$RUNNER_TEMP/allowed_signers"
          ssh-keygen -Y verify -f "$RUNNER_TEMP/allowed_signers" -I upi -n upi-release -s release/SHA256SUMS.sshsig < release/SHA256SUMS
          scripts/check-release-files.sh release "${TAG#upi-v}"

  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish the release
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
