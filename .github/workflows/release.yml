# SPDX-License-Identifier: MIT
name: release

# µPi on PiG: a tag upi-vX.Y.Z builds the static upi executable (Go, CGO off) for Linux x64/ARM64, macOS ARM64/x64 and
# Windows x64, runs the Linux x64 and macOS ARM64 ones (--version must report µPi X.Y.Z), and creates a draft GitHub release with the
# executables and SHA256SUMS. (Linux ARM64, macOS x64 and Windows are cross-compiled and not run: ARM runners are not
# available to every repository.) The asset names are the ones `upi update` looks for (internal/codingagent/micropi_update.go).
# Nothing is published here: a maintainer reviews the draft and publishes it.
#
# A push to PiG that changes VERSION (or this workflow) releases the version VERSION names, creating its tag upi-vX.Y.Z on
# the pushed commit, unless a release of that tag exists already.
on:
  push:
    tags: ["upi-v*"]
    branches: [PiG]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "The upi-vX.Y.Z tag to build (it must exist)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          persist-credentials: false
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$INPUT_TAG
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          else
            tag="upi-v$(cat VERSION)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release of $tag exists already: nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux, goarch: amd64, runner: ubuntu-24.04, run: true}
          - {goos: linux, goarch: arm64, runner: ubuntu-24.04, run: false}
          - {goos: darwin, goarch: arm64, runner: macos-15, run: true}
          - {goos: darwin, goarch: amd64, runner: ubuntu-24.04, run: false}
          - {goos: windows, goarch: amd64, runner: ubuntu-24.04, run: false}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Version matches the tag
        shell: bash
        env:
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          version=$(cat VERSION)
          test "upi-v$version" = "$TAG" || { echo "::error::VERSION is $version, the tag is $TAG"; exit 1; }
          grep -q "MicroPiVersion = \"$version\"" internal/coding/pigversion/pigversion.go || { echo "::error::pigversion.MicroPiVersion is not $version"; exit 1; }
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = windows ] && ext=.exe
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/MichaelKinsy/PiG/coding/cli.Build=${GITHUB_SHA}" \
            -o "dist/upi-$GOOS-$GOARCH$ext" ./cmd/upi
      - name: Run it
        if: matrix.run
        shell: bash
        run: |
          version=$(cat VERSION)
          "dist/upi-${{ matrix.goos }}-${{ matrix.goarch }}" --version | tee /dev/stderr | grep -q "µPi $version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upi-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum upi-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          # A tag that does not exist yet is created on the built commit (a release from a push to PiG).
          target=()
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 || target=(--target "$GITHUB_SHA")
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft "${target[@]}" \
            --title "µPi ${TAG#upi-v}" --generate-notes
